# nginx serves the built SPA. It does NOT proxy /api — in production Traefik
# routes PathPrefix(`/api`) to the api service and everything else here, so this
# container only ever sees non-API requests. `try_files ... /index.html` is the
# SPA history fallback so client-side routes (deep links, refreshes) resolve to
# the app shell instead of 404ing.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Hashed asset filenames (Vite) are safe to cache hard; index.html is not.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Lightweight liveness endpoint for Traefik / uptime checks.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }
}
