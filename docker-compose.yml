# One parameterized Dokploy application contract for preview, development, and
# production. Dokploy isolated deployments add each service to the resource's
# ingress network and Dokploy Domains owns host, path, redirect, and TLS labels.
# The database is a separately managed PostgreSQL 18 service on the selected
# private attachable overlay network.

x-api-image: &api-image
  image: ${API_IMAGE:?API_IMAGE must be a full ghcr.io/rajat2006/unshelf-api digest reference}
  pull_policy: always

services:
  migrate:
    <<: *api-image
    command: ["node", "dist/migrate.js"]
    restart: "no"
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "3"
        mode: blocking
    environment:
      APPLICATION_NAME: ${APPLICATION_NAME:?APPLICATION_NAME is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_TIME_ZONE: ${DATABASE_TIME_ZONE:?DATABASE_TIME_ZONE is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MIGRATION_MODE: ${MIGRATION_MODE:?MIGRATION_MODE is required}
    networks: [database]

  api:
    <<: *api-image
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
        mode: blocking
    environment:
      APPLICATION_NAME: ${APPLICATION_NAME:?APPLICATION_NAME is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_TIME_ZONE: ${DATABASE_TIME_ZONE:?DATABASE_TIME_ZONE is required}
      PORT: "3001"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?CLERK_SECRET_KEY is required}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?CLERK_PUBLISHABLE_KEY is required}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:?YOUTUBE_API_KEY is required}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [database]
    labels:
      - traefik.docker.network=${APP_NAME:?APP_NAME is required}

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE must be a full ghcr.io/rajat2006/unshelf-web digest reference}
    pull_policy: always
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "3"
        mode: blocking
    depends_on: [api]
    labels:
      - traefik.docker.network=${APP_NAME:?APP_NAME is required}

networks:
  database:
    name: ${DATABASE_NETWORK:?DATABASE_NETWORK is required}
    external: true
