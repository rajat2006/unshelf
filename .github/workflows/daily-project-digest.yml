name: Daily Project Digest

on:
  # GitHub schedules are best effort and may run late or be dropped. The digest
  # freezes its actual start time, so delay does not change rolling-window rules.
  schedule:
    - cron: "0 23 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:
    inputs:
      mode:
        description: Preview or deliver the exact prospective Discord payload
        required: true
        type: choice
        options: [preview, deliver]

# This is one trusted, read-only generation job. AI wording is optional. The
# Discord webhook is mapped only on scheduled or explicit manual delivery.
permissions:
  contents: read
  deployments: read
  pull-requests: read
  issues: read

jobs:
  digest:
    name: ${{ github.event_name == 'schedule' && 'Deliver nightly' || inputs.mode == 'deliver' && 'Deliver manually' || 'Preview' }}
    if: github.event_name == 'workflow_dispatch' || vars.DAILY_DIGEST_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: daily-project-digest

    steps:
      - name: Check out trusted digest code
        uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build trusted digest
        run: pnpm --filter @unshelf/daily-project-digest build

      - name: Preview exact Discord payload
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DAILY_DIGEST_OPENAI_API_KEY: ${{ secrets.DAILY_DIGEST_OPENAI_API_KEY }}
        run: node packages/daily-project-digest/dist/cli.js preview

      - name: Deliver exact Discord payload
        if: github.event_name == 'schedule' || inputs.mode == 'deliver'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DAILY_DIGEST_OPENAI_API_KEY: ${{ secrets.DAILY_DIGEST_OPENAI_API_KEY }}
          DAILY_DIGEST_DISCORD_WEBHOOK_URL: ${{ secrets.DAILY_DIGEST_DISCORD_WEBHOOK_URL }}
        run: node packages/daily-project-digest/dist/cli.js deliver

      - name: Record sanitized delivery success
        if: success() && (github.event_name == 'schedule' || inputs.mode == 'deliver')
        run: |
          {
            echo "## Daily Project Digest delivery"
            echo
            echo "Discord accepted the digest."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record sanitized failure
        if: failure()
        run: |
          {
            echo "## Daily Project Digest failure"
            echo
            echo "The digest failed safely. Review the failed step for its sanitized error."
            echo "No credentials or provider responses were recorded."
          } >> "$GITHUB_STEP_SUMMARY"
