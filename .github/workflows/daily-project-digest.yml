name: Daily Project Digest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview or deliver the exact prospective Discord payload
        required: true
        type: choice
        options: [preview, deliver]

# This is one trusted, read-only generation job. AI wording is optional. The
# Discord webhook is mapped only on the explicit manual-delivery step.
permissions:
  contents: read
  deployments: read
  pull-requests: read
  issues: read

jobs:
  digest:
    name: ${{ inputs.mode == 'deliver' && 'Deliver' || 'Preview' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out trusted digest code
        uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build trusted digest
        run: pnpm --filter @unshelf/daily-project-digest build

      - name: Preview exact Discord payload
        if: inputs.mode == 'preview'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DAILY_DIGEST_OPENAI_API_KEY: ${{ secrets.DAILY_DIGEST_OPENAI_API_KEY }}
        run: node packages/daily-project-digest/dist/cli.js preview

      - name: Deliver exact Discord payload
        if: inputs.mode == 'deliver'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DAILY_DIGEST_OPENAI_API_KEY: ${{ secrets.DAILY_DIGEST_OPENAI_API_KEY }}
          DAILY_DIGEST_DISCORD_WEBHOOK_URL: ${{ secrets.DAILY_DIGEST_DISCORD_WEBHOOK_URL }}
        run: node packages/daily-project-digest/dist/cli.js deliver
