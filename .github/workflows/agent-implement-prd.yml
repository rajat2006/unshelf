name: Agent Implement PRD

# The PRD variant of the core spine (spec #52 / #68). Applying `agent:implement`
# to a PRD-shaped issue (a parent that owns native sub-issues) drives the PRD to
# a reviewed draft PR — but INCREMENTALLY, one sub-issue per run, exactly as CVM
# does. Each run implements the first still-open sub-issue on an ACCUMULATING
# branch, closes it, then re-labels the PRD (via AGENT_PAT) so the next run picks
# up the next sub-issue. Review is requested only once every sub-issue is closed.
# The agent only produces commits + output files — this workflow owns every git,
# `gh`, and label mutation.
#
# This listens for the SAME `agent:implement` labeled event as
# `agent-implement.yml`. The two disambiguate purely by issue shape: the normal
# workflow proceeds only when the issue has NO sub-issues; this one only when it
# HAS them. So exactly one of the two runs for any given issue.

on:
  issues:
    types: [labeled]

jobs:
  implement-prd:
    if: github.event.label.name == 'agent:implement'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      # Per-PRD serialisation. Its own group, distinct from `agent-implement.yml`'s
      # — the shape-guard, not concurrency, is what guarantees exactly one of the
      # two proceeds. This group instead serialises the PRD's OWN chain: run N
      # re-labels the PRD to fire run N+1, and cancel-in-progress: false means a
      # queued next-sub-issue run waits for the current one rather than killing it
      # mid-commit.
      group: agent-implement-prd-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write

    env:
      PRD_NUMBER: ${{ github.event.issue.number }}
      PRD_TITLE: ${{ github.event.issue.title }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Detect — sub-issue shape, next open sub-issue, and provider
        id: shape
        run: |
          set -euo pipefail

          # Full label set (AC: read the whole set, not just the trigger label) —
          # both the defensive trigger re-check and the provider switch read it.
          labels_json=$(gh issue view "$PRD_NUMBER" --json labels --jq '[.labels[].name]')
          echo "labels_json=$labels_json" >> "$GITHUB_OUTPUT"

          # Provider switch (spec #64): `agent:codex` present ⇒ Codex, needing the
          # codex CLI + subscription seat; absent ⇒ Claude Code. Mirrors
          # resolveAgent() so the workflow's setup matches what the runner resolves.
          if echo "$labels_json" | jq -e 'index("agent:codex")' >/dev/null; then
            echo "is_codex=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_codex=false" >> "$GITHUB_OUTPUT"
          fi

          # Defensive re-check: the trigger label must still be present (it could
          # have been removed between the event and this run).
          if ! echo "$labels_json" | jq -e 'index("agent:implement")' >/dev/null; then
            echo "agent:implement no longer on the PRD — skipping."
            echo "mode=silent" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # THE SHAPE FETCH — fail CLOSED, never guess. An issue with no
          # sub-issues returns `200 []` (exit 0); only a genuine API/auth/network
          # failure exits non-zero. Retry a few times to ride out transient blips,
          # then treat a persistent failure as an ERROR (block) — NOT as "no
          # sub-issues", which would silently misroute a real PRD to the leaf
          # workflow. The leaf workflow's detect fails closed the same way, so the
          # two never both proceed (or both silently drop) on an unknown shape.
          sub_issues_json=""
          fetch_ok=false
          for attempt in 1 2 3; do
            if sub_issues_json=$(gh api "repos/${GH_REPO}/issues/${PRD_NUMBER}/sub_issues" 2>/dev/null); then
              fetch_ok=true
              break
            fi
            echo "sub_issues fetch attempt ${attempt} failed; retrying…"
            sleep 3
          done
          if [ "$fetch_ok" != "true" ]; then
            echo "Could not determine issue shape after retries — failing closed."
            echo "mode=error" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sub_count=$(echo "$sub_issues_json" | jq 'length')

          # A leaf issue (no sub-issues) belongs to the normal `agent-implement.yml`,
          # which fires on the SAME event — SILENTLY skip so we neither race it nor
          # strip its trigger label. Do not comment or edit labels here.
          if [ "$sub_count" = "0" ]; then
            echo "No sub-issues (leaf) — silent skip; the normal implement flow handles it."
            echo "mode=silent" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A PRD that is itself a sub-issue of another issue: nested PRDs are not
          # supported in v1. Refuse.
          owner="${GH_REPO%/*}"
          repo="${GH_REPO#*/}"
          parent_number=$(gh api graphql \
            -f query='query($owner: String!, $repo: String!, $num: Int!) { repository(owner: $owner, name: $repo) { issue(number: $num) { parent { number } } } }' \
            -f owner="$owner" -f repo="$repo" -F num="$PRD_NUMBER" \
            --jq '.data.repository.issue.parent.number // empty' 2>/dev/null || echo "")
          if [ -n "$parent_number" ]; then
            echo "parent_number=$parent_number" >> "$GITHUB_OUTPUT"
            echo "mode=refuse-nested-prd" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A sub-issue that has its OWN sub-issues: v1 is flat-only. Refuse.
          for child_num in $(echo "$sub_issues_json" | jq -r '.[].number'); do
            child_sub_count=$(gh api "repos/${GH_REPO}/issues/${child_num}/sub_issues" --jq 'length' 2>/dev/null || echo "0")
            if [ "$child_sub_count" != "0" ]; then
              echo "nested_child_number=$child_num" >> "$GITHUB_OUTPUT"
              echo "mode=refuse-nested-child" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          # First still-open sub-issue, in the order the sub-issues API returns.
          next_open=$(echo "$sub_issues_json" | jq -r '[.[] | select(.state == "open")] | .[0] // empty')
          if [ -z "$next_open" ]; then
            echo "All sub-issues already closed — nothing to implement."
            echo "mode=refuse-all-closed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "next_open_number=$(echo "$next_open" | jq -r '.number')" >> "$GITHUB_OUTPUT"
          # Title may contain special chars; write via heredoc.
          {
            echo "next_open_title<<SUBEOF"
            echo "$next_open" | jq -r '.title'
            echo "SUBEOF"
          } >> "$GITHUB_OUTPUT"
          echo "mode=run" >> "$GITHUB_OUTPUT"

      - name: Refuse — could not determine issue shape
        if: steps.shape.outputs.mode == 'error'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          gh issue edit "$PRD_NUMBER" --remove-label "agent:implement" || true
          gh issue edit "$PRD_NUMBER" --add-label "agent:blocked" || true
          gh issue comment "$PRD_NUMBER" --body "Refused to run \`agent:implement\`: could not read this issue's sub-issue shape after retries (a transient GitHub API failure). Nothing was routed, to avoid misrouting a PRD to the single-issue path. Clear \`agent:blocked\` and re-add \`agent:implement\` to retry. Run: ${RUN_URL}"

      - name: Refuse — nested PRD
        if: steps.shape.outputs.mode == 'refuse-nested-prd'
        env:
          PARENT_NUMBER: ${{ steps.shape.outputs.parent_number }}
        run: |
          set -uo pipefail
          gh issue edit "$PRD_NUMBER" --remove-label "agent:implement" || true
          gh issue edit "$PRD_NUMBER" --add-label "agent:blocked" || true
          gh issue comment "$PRD_NUMBER" --body "Refused to run: this issue has sub-issues but is itself a sub-issue of #${PARENT_NUMBER}. Nested PRDs are not supported in v1 — flatten the structure before retrying."

      - name: Refuse — sub-issue has its own sub-issues
        if: steps.shape.outputs.mode == 'refuse-nested-child'
        env:
          NESTED_CHILD: ${{ steps.shape.outputs.nested_child_number }}
        run: |
          set -uo pipefail
          gh issue edit "$PRD_NUMBER" --remove-label "agent:implement" || true
          gh issue edit "$PRD_NUMBER" --add-label "agent:blocked" || true
          gh issue comment "$PRD_NUMBER" --body "Refused to run: sub-issue #${NESTED_CHILD} itself has sub-issues. Nested sub-issues are not supported in v1 — each sub-issue must be a leaf. Flatten the structure before retrying."

      - name: Refuse — all sub-issues already closed
        if: steps.shape.outputs.mode == 'refuse-all-closed'
        run: |
          set -uo pipefail
          gh issue edit "$PRD_NUMBER" --remove-label "agent:implement" || true
          gh issue edit "$PRD_NUMBER" --add-label "agent:blocked" || true
          gh issue comment "$PRD_NUMBER" --body "Refused to run: all sub-issues are already closed; nothing to implement. Reopen or add a sub-issue first, then re-add \`agent:implement\`."

      - name: Transition labels — remove implement/blocked, add in-progress
        if: steps.shape.outputs.mode == 'run'
        run: |
          set -euo pipefail
          gh issue edit "$PRD_NUMBER" --remove-label "agent:implement" || true
          gh issue edit "$PRD_NUMBER" --remove-label "agent:blocked" || true
          gh issue edit "$PRD_NUMBER" --add-label "agent:in-progress"

      - name: Checkout main
        if: steps.shape.outputs.mode == 'run'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # AGENT_PAT so a push may include changes under .github/workflows/
          # (GITHUB_TOKEN lacks the `workflows` scope). Falls back to GITHUB_TOKEN
          # when unset — workflow-file changes are then rejected on push, but
          # ordinary code changes still land.
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

      - name: Compute branch name
        if: steps.shape.outputs.mode == 'run'
        id: branch
        run: |
          set -euo pipefail
          # PRD branches are keyed on the PRD number and namespaced `agent/prd-` so
          # every sub-issue run accumulates onto the SAME branch (distinct from the
          # leaf `agent/issue-` namespace). Strip stray separators after truncation.
          slug=$(echo "$PRD_TITLE" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g' \
            | cut -c1-50 \
            | sed -E 's/^-+|-+$//g')
          [ -z "$slug" ] && slug="untitled"
          echo "name=agent/prd-${PRD_NUMBER}-${slug}" >> "$GITHUB_OUTPUT"

      - name: Set up git identity and resume/create the accumulating branch
        if: steps.shape.outputs.mode == 'run'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          git config user.name "unshelf-agent[bot]"
          git config user.email "unshelf-agent[bot]@users.noreply.github.com"
          # Resume the PRD branch if it already exists (earlier sub-issue runs),
          # else cut it fresh from main. Commits accumulate across runs — this is
          # why the push below is NOT a force-push.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi

      - name: Setup pnpm
        if: steps.shape.outputs.mode == 'run'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        if: steps.shape.outputs.mode == 'run'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        if: steps.shape.outputs.mode == 'run'
        run: pnpm install --frozen-lockfile

      - name: Install Claude Code
        if: steps.shape.outputs.mode == 'run'
        run: npm install -g @anthropic-ai/claude-code

      # Codex CLI only when this PRD opted in via `agent:codex` — the Claude
      # default never pays for it. Runner-side auth is materialised by
      # `prepareCodexAuth` inside the run scripts.
      - name: Install Codex CLI
        if: steps.shape.outputs.mode == 'run' && steps.shape.outputs.is_codex == 'true'
        run: npm install -g @openai/codex

      - name: Run implement-prd (one sub-issue)
        if: steps.shape.outputs.mode == 'run'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Codex subscription seat — ignored on the Claude default; the run
          # script's prepareCodexAuth writes $CODEX_HOME/auth.json only when Codex
          # is resolved. OPENAI_KEY / OPENAI_API_KEY are deliberately NOT passed.
          CODEX_HOME: ${{ runner.temp }}/.codex
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          AGENT_LABELS: ${{ steps.shape.outputs.labels_json }}
          PRD_NUMBER: ${{ env.PRD_NUMBER }}
          PRD_TITLE: ${{ env.PRD_TITLE }}
          SUB_ISSUE_NUMBER: ${{ steps.shape.outputs.next_open_number }}
          SUB_ISSUE_TITLE: ${{ steps.shape.outputs.next_open_title }}
          BRANCH: ${{ steps.branch.outputs.name }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: pnpm exec tsx .sandcastle/implement-prd/implement-prd.ts

      - name: Push branch
        if: steps.shape.outputs.mode == 'run' && success()
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        # NOT a force-push: the branch accumulates commits across sub-issue runs.
        run: git push origin "$BRANCH"

      - name: Close the completed sub-issue
        if: steps.shape.outputs.mode == 'run' && success()
        env:
          SUB_ISSUE_NUMBER: ${{ steps.shape.outputs.next_open_number }}
        run: |
          set -euo pipefail
          commit_sha=$(git rev-parse HEAD)
          gh issue close "$SUB_ISSUE_NUMBER" --comment "Implemented in ${commit_sha}. Part of #${PRD_NUMBER}."

      - name: Check whether a PR already exists for this branch
        if: steps.shape.outputs.mode == 'run' && success()
        id: pr_lookup
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          existing_pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          echo "existing_pr=$existing_pr" >> "$GITHUB_OUTPUT"

      - name: Write PR title and description (only when opening a new PR)
        if: steps.shape.outputs.mode == 'run' && success() && steps.pr_lookup.outputs.existing_pr == ''
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEX_HOME: ${{ runner.temp }}/.codex
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          AGENT_LABELS: ${{ steps.shape.outputs.labels_json }}
          PRD_NUMBER: ${{ env.PRD_NUMBER }}
          PRD_TITLE: ${{ env.PRD_TITLE }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: pnpm exec tsx .sandcastle/write-prd-pr/write-prd-pr.ts

      - name: Open draft PR if one doesn't exist for this branch
        if: steps.shape.outputs.mode == 'run' && success()
        id: open_pr
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          EXISTING_PR: ${{ steps.pr_lookup.outputs.existing_pr }}
        run: |
          set -euo pipefail
          if [ -n "$EXISTING_PR" ]; then
            echo "pr_number=$EXISTING_PR" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            pr_title=$(head -c 256 "${RUNNER_TEMP}/pr_title.txt")
            pr_url=$(gh pr create \
              --draft \
              --base main \
              --head "$BRANCH" \
              --title "$pr_title" \
              --body-file "${RUNNER_TEMP}/pr_description.txt")
            echo "pr_number=$(basename "$pr_url")" >> "$GITHUB_OUTPUT"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Propagate provider label (agent:codex) to the PR
        if: steps.shape.outputs.mode == 'run' && success() && steps.open_pr.outputs.created == 'true' && steps.shape.outputs.is_codex == 'true'
        env:
          PR_NUMBER: ${{ steps.open_pr.outputs.pr_number }}
        # Provider continuity (spec §C/#64): the review workflow resolves its
        # provider from the PR's OWN label set, so a Codex-implemented PRD must
        # carry agent:codex onto the PR. Only meaningful on PR creation (the first
        # sub-issue run); GITHUB_TOKEN is fine — agent:codex triggers nothing.
        run: gh pr edit "$PR_NUMBER" --add-label "agent:codex"

      - name: Re-check remaining open sub-issues
        if: steps.shape.outputs.mode == 'run' && success()
        id: remaining
        run: |
          set -euo pipefail
          remaining=$(gh api "repos/${GH_REPO}/issues/${PRD_NUMBER}/sub_issues" \
            --jq '[.[] | select(.state == "open")] | length' 2>/dev/null || echo "0")
          echo "count=$remaining" >> "$GITHUB_OUTPUT"

      - name: Chain — re-label the PRD to pick up the next sub-issue
        if: steps.shape.outputs.mode == 'run' && success() && steps.remaining.outputs.count != '0'
        env:
          # AGENT_PAT so the labeled event fires the next PRD run — a
          # GITHUB_TOKEN-applied label never triggers a downstream workflow. Falls
          # back to GITHUB_TOKEN, which stalls the chain until a human re-labels.
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
        run: |
          set -uo pipefail
          if [ -n "${AGENT_PAT:-}" ]; then
            if GH_TOKEN="$AGENT_PAT" gh issue edit "$PRD_NUMBER" --add-label "agent:implement"; then
              exit 0
            fi
            echo "AGENT_PAT label add failed; falling back to GITHUB_TOKEN (chain will need a manual re-label)."
          fi
          gh issue edit "$PRD_NUMBER" --add-label "agent:implement"

      - name: Hand off to review — all sub-issues complete
        if: steps.shape.outputs.mode == 'run' && success() && steps.remaining.outputs.count == '0'
        env:
          PR_NUMBER: ${{ steps.open_pr.outputs.pr_number }}
          # AGENT_PAT so the labeled event fires the review workflow. Falls back to
          # GITHUB_TOKEN; a human then re-adds agent:review to fire it.
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
        run: |
          set -uo pipefail
          if [ -n "${AGENT_PAT:-}" ]; then
            if GH_TOKEN="$AGENT_PAT" gh pr edit "$PR_NUMBER" --add-label "agent:review"; then
              exit 0
            fi
            echo "AGENT_PAT label add failed; falling back to GITHUB_TOKEN (review will need a manual re-label)."
          fi
          gh pr edit "$PR_NUMBER" --add-label "agent:review"

      - name: Mark blocked on failure
        # `failure()` covers crashes and the idle watchdog (a non-zero tsx exit).
        # `cancelled()` covers the hard 60-min job `timeout-minutes` breach, which
        # cancels rather than fails the job — without it, a timed-out run would
        # never reach the blocked path.
        if: steps.shape.outputs.mode == 'run' && (failure() || cancelled())
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SUB_ISSUE_NUMBER: ${{ steps.shape.outputs.next_open_number }}
        run: |
          set -uo pipefail
          reason="(no reason file written — check the workflow logs)"
          if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
          fi
          gh issue edit "$PRD_NUMBER" --add-label "agent:blocked" || true
          {
            printf '%s\n\n' "\`agent:implement\` (PRD mode) run failed while implementing sub-issue #${SUB_ISSUE_NUMBER}."
            printf '**Reason:** %s\n\n' "$reason"
            printf '**Workflow run:** %s\n\n' "$RUN_URL"
            printf '%s\n' 'Clear `agent:blocked` and re-add `agent:implement` to retry from this sub-issue.'
          } > "${RUNNER_TEMP}/blocked_comment.md"
          gh issue comment "$PRD_NUMBER" --body-file "${RUNNER_TEMP}/blocked_comment.md"
          if [ -n "${SUB_ISSUE_NUMBER:-}" ]; then
            gh issue comment "$SUB_ISSUE_NUMBER" --body "Implementation attempt failed. See PRD #${PRD_NUMBER} for status. Workflow run: ${RUN_URL}" || true
          fi

      - name: Always remove in-progress
        if: always() && steps.shape.outputs.mode == 'run'
        run: gh issue edit "$PRD_NUMBER" --remove-label "agent:in-progress" || true
