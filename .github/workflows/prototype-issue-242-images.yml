name: PROTOTYPE issue 242 package cleanup

on:
  push:
    branches: [prototype/issue-242-dokploy-routing]

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    name: Delete prototype package versions
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Delete issue 242 image versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          for package in unshelf-api unshelf-web; do
            version_ids="$(
              gh api --paginate \
                "/users/${OWNER}/packages/container/${package}/versions?per_page=100" \
                --jq '.[] | select(any(.metadata.container.tags[]?; startswith("prototype-issue-242-"))) | .id'
            )"

            for version_id in ${version_ids}; do
              gh api --method DELETE \
                "/users/${OWNER}/packages/container/${package}/versions/${version_id}"
            done
          done
