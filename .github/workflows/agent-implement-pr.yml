name: Agent Implement-PR

# Address review comments on an open PR (spec #52 / #66): applying
# `agent:implement-pr` to a PR runs the `implement-pr` capability, which reads the
# PR's review threads, changes what it safely can, and commits; the workflow
# pushes those fix commits and posts a summary comment. It does NOT flip the PR's
# draft/ready state — that belongs to the review leg. The agent only produces
# commits + output files — this workflow owns every git, `gh`, and label mutation
# (spec invariant H).

on:
  pull_request_target:
    types: [labeled]

jobs:
  implement-pr:
    if: github.event.label.name == 'agent:implement-pr'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      # SHARED per-PR group across every PR-mutating capability (review /
      # implement-pr / update-branch), keyed on the PR number, so they queue
      # rather than double-mutate the same PR. Queues, never cancels — an
      # in-flight run is not killed. `queue: max` is required for a real queue:
      # the default `queue: single` keeps only ONE pending run, so a third
      # PR-mutating trigger would evict the second instead of waiting.
      group: agent-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pull-requests: write
      issues: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Gate — read the PR label set, provider, and originating issue
        id: gate
        run: |
          set -euo pipefail
          # Full PR label set (AC: resolve the provider from the whole set, not
          # just the just-added trigger label).
          labels_json=$(gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name]')
          echo "labels_json=$labels_json" >> "$GITHUB_OUTPUT"

          # Provider switch (spec #64): mirror resolveAgent() so the workflow's
          # provider-specific setup matches what the runner resolves.
          if echo "$labels_json" | jq -e 'index("agent:codex")' >/dev/null; then
            echo "is_codex=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_codex=false" >> "$GITHUB_OUTPUT"
          fi

          # Defensive re-check: the trigger label must still be present (it could
          # have been removed between the event and this run).
          if ! echo "$labels_json" | jq -e 'index("agent:implement-pr")' >/dev/null; then
            echo "agent:implement-pr no longer on the PR — skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "refusal=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Refuse a closed or merged PR (#66 is scoped to an OPEN PR). The trigger
          # is human-applied to an arbitrary PR — unlike agent:review, which
          # implement adds to a fresh draft — so a label on a merged/closed PR must
          # not start a run that would then try to push onto a settled branch.
          state=$(gh pr view "$PR_NUMBER" --json state --jq '.state')
          if [ "$state" != "OPEN" ]; then
            echo "PR is $state, not OPEN — refusing implement-pr."
            echo "pr_state=$state" >> "$GITHUB_OUTPUT"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "refusal=closed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # SECURITY: this workflow runs under `pull_request_target`, so the base
          # repo's secrets (CLAUDE_CODE_OAUTH_TOKEN / CODEX_AUTH_JSON / AGENT_PAT)
          # are in scope. Refuse fork PRs so their (untrusted) head code is never
          # checked out and executed with those secrets available. The
          # implement → review chain only ever produces same-repo `agent/issue-*`
          # branches, so this refuses nothing the automation creates.
          is_cross=$(gh pr view "$PR_NUMBER" --json isCrossRepository --jq '.isCrossRepository')
          if [ "$is_cross" = "true" ]; then
            echo "PR is from a fork — refusing implement-pr under pull_request_target."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "refusal=fork" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The PR head branch is what we check out, commit onto, and push.
          head_ref=$(gh pr view "$PR_NUMBER" --json headRefName --jq '.headRefName')
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"

          # Resolve the originating issue from the PR body ("Closes #N") so the
          # prompt reads the right spec. Fall back to the PR itself when a PR opens
          # no issue link.
          pr_body=$(gh pr view "$PR_NUMBER" --json body --jq '.body')
          issue_number=$(printf '%s' "$pr_body" \
            | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+' | head -n1 || true)
          if [ -n "$issue_number" ]; then
            issue_title=$(gh issue view "$issue_number" --json title --jq '.title' 2>/dev/null || echo "")
          else
            issue_number="$PR_NUMBER"
            issue_title=$(gh pr view "$PR_NUMBER" --json title --jq '.title')
          fi
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "issue_title=$issue_title" >> "$GITHUB_OUTPUT"

          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "refusal=" >> "$GITHUB_OUTPUT"

      - name: Refuse — PR is from a fork
        if: steps.gate.outputs.refusal == 'fork'
        run: |
          set -euo pipefail
          gh pr edit "$PR_NUMBER" --remove-label "agent:implement-pr" || true
          gh pr comment "$PR_NUMBER" --body "Refused to run \`agent:implement-pr\`: this PR is from a fork. The workflow runs under \`pull_request_target\` with repository secrets in scope, so it deliberately does not check out or execute fork head code. A maintainer can address the comments manually. Cleared \`agent:implement-pr\`."

      - name: Refuse — PR is closed or merged
        if: steps.gate.outputs.refusal == 'closed'
        env:
          PR_STATE: ${{ steps.gate.outputs.pr_state }}
        run: |
          set -euo pipefail
          gh pr edit "$PR_NUMBER" --remove-label "agent:implement-pr" || true
          gh pr comment "$PR_NUMBER" --body "Refused to run \`agent:implement-pr\`: this PR is ${PR_STATE}, not open. Re-open it before asking an agent to address review comments. Cleared \`agent:implement-pr\`."

      - name: Transition labels — remove implement-pr/blocked, add in-progress
        if: steps.gate.outputs.proceed == 'true'
        # Mirror the review/implement lifecycle on the PR: swap the trigger for
        # agent:in-progress on start, clear any stale blocked, so the PR's label
        # reflects an active run and a failure lands it back in agent:blocked.
        run: |
          set -euo pipefail
          gh pr edit "$PR_NUMBER" --remove-label "agent:implement-pr" || true
          gh pr edit "$PR_NUMBER" --remove-label "agent:blocked" || true
          gh pr edit "$PR_NUMBER" --add-label "agent:in-progress"

      - name: Checkout the PR branch
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.head_ref }}
          fetch-depth: 0
          # AGENT_PAT because implement-pr commits + pushes fixes (a push touching
          # .github/workflows/ needs the `workflows` scope GITHUB_TOKEN lacks).
          # Falls back to GITHUB_TOKEN, which still pushes ordinary code changes.
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

      - name: Fetch the review base (origin/main)
        if: steps.gate.outputs.proceed == 'true'
        # Explicit dest refspec so `origin/main` resolves for `git diff
        # origin/main...HEAD`, whatever narrow refspec the checkout left behind.
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Setup pnpm
        if: steps.gate.outputs.proceed == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Claude Code
        if: steps.gate.outputs.proceed == 'true'
        run: npm install -g @anthropic-ai/claude-code

      # Codex CLI only when this PR opted in via `agent:codex`; the Claude default
      # never pays for it. Runner-side auth is materialised by prepareCodexAuth.
      - name: Install Codex CLI
        if: steps.gate.outputs.proceed == 'true' && steps.gate.outputs.is_codex == 'true'
        run: npm install -g @openai/codex

      - name: Configure git identity
        if: steps.gate.outputs.proceed == 'true'
        # implement-pr commits its fixes; git needs an author identity. Same bot
        # identity implement/review use.
        run: |
          set -euo pipefail
          git config user.name "unshelf-agent[bot]"
          git config user.email "unshelf-agent[bot]@users.noreply.github.com"

      - name: Run implement-pr
        if: steps.gate.outputs.proceed == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Codex subscription seat — ignored on the Claude default; prepareCodexAuth
          # writes $CODEX_HOME/auth.json only when Codex is resolved. OPENAI_KEY /
          # OPENAI_API_KEY are deliberately NOT passed (spec #64).
          CODEX_HOME: ${{ runner.temp }}/.codex
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          AGENT_LABELS: ${{ steps.gate.outputs.labels_json }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE_NUMBER: ${{ steps.gate.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.gate.outputs.issue_title }}
          BRANCH: ${{ steps.gate.outputs.head_ref }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: pnpm exec tsx .sandcastle/implement-pr/implement-pr.ts

      - name: Push fix commits
        if: steps.gate.outputs.proceed == 'true' && success()
        env:
          HEAD_REF: ${{ steps.gate.outputs.head_ref }}
        # Push the agent's fix commits back onto the PR branch. A no-op when the
        # agent committed nothing (every comment deferred). NOT a force-push: fixes
        # only append to the head the run checked out; a rejected push means the
        # branch moved under us and should fail loudly rather than clobber.
        run: git push origin "HEAD:refs/heads/${HEAD_REF}"

      - name: Post the summary comment
        if: steps.gate.outputs.proceed == 'true' && success()
        # implement-pr.ts wrote a Markdown summary of what it addressed vs
        # deferred. Post it as one PR comment. Best-effort (|| true): the fix
        # commits are the deliverable and are already pushed by the step above, so
        # a transient comment-post failure must not flip a successful run to
        # blocked and drop those commits on the floor.
        run: gh pr comment "$PR_NUMBER" --body-file "${RUNNER_TEMP}/pr_comment.md" || true

      - name: Mark blocked on failure
        # `failure()` covers crashes and the idle watchdog; `cancelled()` covers a
        # hard 60-min timeout breach. The PR keeps whatever draft/ready state it
        # had (implement-pr never changes it), and it lands in agent:blocked with a
        # run-URL comment — the same failure lifecycle as agent-implement/review.
        if: steps.gate.outputs.proceed == 'true' && (failure() || cancelled())
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          reason="(no reason file written — check the workflow logs)"
          if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
          fi
          gh pr edit "$PR_NUMBER" --add-label "agent:blocked" || true
          {
            printf '%s\n\n' '`agent:implement-pr` run failed.'
            printf '**Reason:** %s\n\n' "$reason"
            printf '**Workflow run:** %s\n\n' "$RUN_URL"
            printf '%s\n' 'Clear `agent:blocked` and re-add `agent:implement-pr` to retry.'
          } > "${RUNNER_TEMP}/implement_pr_failed.md"
          gh pr comment "$PR_NUMBER" --body-file "${RUNNER_TEMP}/implement_pr_failed.md" || true

      - name: Always remove in-progress
        # Clear the active-run marker whatever the outcome (mirrors implement's
        # `if: always()` in-progress removal). The trigger label was already
        # cleared in the transition step, so a retry is a clean re-add.
        if: always() && steps.gate.outputs.proceed == 'true'
        run: gh pr edit "$PR_NUMBER" --remove-label "agent:in-progress" || true
