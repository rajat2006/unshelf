name: Deliver preview

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: preview-delivery
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      source_sha: ${{ steps.authority.outputs.source_sha }}
      trusted_sha: ${{ steps.authority.outputs.trusted_sha }}
      pr_number: ${{ steps.authority.outputs.pr_number }}
      logical_name: ${{ steps.authority.outputs.logical_name }}
    steps:
      - id: authority
        name: Select an eligible exact pull-request revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          pull="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          jq -e --arg repository "$GITHUB_REPOSITORY" '
            .state == "open" and .draft == false and .base.ref == "dev" and
            .head.repo.full_name == $repository and
            any(.labels[]; .name == "deploy:preview")
          ' <<<"$pull" >/dev/null
          source_sha="$(jq -er .head.sha <<<"$pull")"
          trusted_sha="$(jq -er .base.sha <<<"$pull")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$trusted_sha" =~ ^[0-9a-f]{40}$ ]]
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${source_sha}&event=pull_request&status=completed&per_page=100")"
          run_ids="$(jq -r --arg sha "$source_sha" '.workflow_runs[] | select(.head_sha == $sha and .event == "pull_request" and .conclusion == "success") | .id' <<<"$runs")"
          approved=false
          while IFS= read -r run_id; do
            test -n "$run_id" || continue
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" --jq '.jobs | any(.name == "Product" and .status == "completed" and .conclusion == "success")' | grep -qx true; then approved=true; break; fi
          done <<<"$run_ids"
          test "$approved" = true
          changed="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${trusted_sha}...${source_sha}" --paginate --jq '.files[].filename')"
          policy="$RUNNER_TEMP/delivery-policy.mjs"
          gh api "repos/${GITHUB_REPOSITORY}/contents/.github/scripts/delivery-policy.mjs?ref=${trusted_sha}" --jq .content | base64 --decode >"$policy"
          jq -Rsc '{paths:split("\n") | map(select(length > 0))}' <<<"$changed" | node "$policy" allow-preview-changes >/dev/null
          printf 'source_sha=%s\ntrusted_sha=%s\npr_number=%s\nlogical_name=unshelf-pr-%s\n' "$source_sha" "$trusted_sha" "$PR_NUMBER" "$PR_NUMBER" >>"$GITHUB_OUTPUT"

  inspect:
    needs: authorize
    environment: preview
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.target.outputs.deploy }}
      source_sha: ${{ needs.authorize.outputs.source_sha }}
      pr_number: ${{ needs.authorize.outputs.pr_number }}
      logical_name: ${{ needs.authorize.outputs.logical_name }}
      compose_id: ${{ steps.target.outputs.compose_id }}
      runtime_name: ${{ steps.target.outputs.runtime_name }}
      public_origin: ${{ steps.target.outputs.public_origin }}
    steps:
      - id: target
        name: Resolve exact preview identity and admission
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
          TRUSTED_SHA: ${{ needs.authorize.outputs.trusted_sha }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
          LOGICAL_NAME: ${{ needs.authorize.outputs.logical_name }}
          DOKPLOY_URL: ${{ vars.DOKPLOY_NONPRODUCTION_URL }}
          ENVIRONMENT_ID: ${{ vars.DOKPLOY_PREVIEW_ENV_ID }}
          DOMAIN_SUFFIX: ${{ vars.DOKPLOY_PREVIEW_DOMAIN_SUFFIX }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_NONPRODUCTION_API_KEY }}
          DOKPLOY_COMPOSE_ENV: ${{ secrets.DOKPLOY_PREVIEW_COMPOSE_ENV }}
        run: |
          set -euo pipefail
          node -e 'const u=new URL(process.env.DOKPLOY_URL);if(u.protocol!=="https:"||u.origin!==process.env.DOKPLOY_URL)process.exit(1)'
          [[ "$DOMAIN_SUFFIX" =~ ^[a-z0-9.-]+$ ]] && [[ "$DOMAIN_SUFFIX" != .* ]] && [[ "$DOMAIN_SUFFIX" != *. ]]
          test -n "$ENVIRONMENT_ID" && test -n "$DOKPLOY_API_KEY" && test -n "$DOKPLOY_COMPOSE_ENV"
          grep -qx 'MIGRATION_MODE=verify' <<<"$DOKPLOY_COMPOSE_ENV"
          if grep -Eq '^(API_IMAGE|WEB_IMAGE|PUBLIC_ORIGIN|APPLICATION_NAME|APP_NAME|DATABASE_NETWORK)=' <<<"$DOKPLOY_COMPOSE_ENV"; then exit 1; fi
          public_origin="https://pr-${PR_NUMBER}.${DOMAIN_SUFFIX}"
          policy="$RUNNER_TEMP/delivery-policy.mjs"
          gh api "repos/${GITHUB_REPOSITORY}/contents/.github/scripts/delivery-policy.mjs?ref=${TRUSTED_SHA}" --jq .content | base64 --decode >"$policy"
          records="$(curl --fail --silent --show-error -H "x-api-key: $DOKPLOY_API_KEY" --get --data-urlencode "environmentId=$ENVIRONMENT_ID" --data-urlencode 'limit=100' "$DOKPLOY_URL/api/compose.search")"
          # Dokploy owns the suffixed runtime appName, while the exact logical name owns lookup and capacity (ADR-0022).
          selection="$(jq -n --argjson records "$records" --arg logicalName "$LOGICAL_NAME" --argjson prNumber "$PR_NUMBER" '{records:$records,logicalName:$logicalName,prNumber:$prNumber}' | node "$policy" select-preview)"
          compose_id="$(jq -r '.composeId // ""' <<<"$selection")"
          runtime_name="$(jq -r '.runtimeName // ""' <<<"$selection")"
          description="$(jq -r --arg id "$compose_id" '[.. | objects | select(.composeId? == $id)][0].description // ""' <<<"$records")"
          deploy=true
          live_record="$(if test -n "$compose_id"; then curl --fail --silent --show-error -H "x-api-key: $DOKPLOY_API_KEY" --get --data-urlencode "composeId=$compose_id" "$DOKPLOY_URL/api/compose.one"; else printf '{}'; fi)"
          live_env="$(jq -r '.. | objects | .env? // empty' <<<"$live_record" | head -n1)"
          live_compose="$(jq -r '.. | objects | .composeFile? // empty' <<<"$live_record" | head -n1)"
          isolated="$(jq -r '.. | objects | .isolatedDeployment? // empty' <<<"$live_record" | head -n1)"
          trusted_compose="$(gh api "repos/${GITHUB_REPOSITORY}/contents/docker-compose.yml?ref=${TRUSTED_SHA}" --jq .content | base64 --decode)"
          marker="${description#unshelf:last-healthy }"
          marker_api="$(jq -r '.apiDigest // ""' <<<"$marker" 2>/dev/null || true)"
          marker_web="$(jq -r '.webDigest // ""' <<<"$marker" 2>/dev/null || true)"
          configuration_matches="$(jq -n --arg aggregateEnv "$DOKPLOY_COMPOSE_ENV" --arg liveEnv "$live_env" --arg apiImage "ghcr.io/rajat2006/unshelf-api@$marker_api" --arg webImage "ghcr.io/rajat2006/unshelf-web@$marker_web" --arg publicOrigin "$public_origin" --arg logicalName "$LOGICAL_NAME" '{aggregateEnv:$aggregateEnv,liveEnv:$liveEnv,injected:{API_IMAGE:$apiImage,WEB_IMAGE:$webImage,PUBLIC_ORIGIN:$publicOrigin,APPLICATION_NAME:$logicalName,DATABASE_NETWORK:"unshelf-nonprod-db"}}' | node "$policy" configuration-matches | jq -r .matches)"
          if test -n "$compose_id" && test "$marker" != "$description" && test "$isolated" = true && test "$live_compose" = "$trusted_compose" && test "$configuration_matches" = true && jq -e --arg sha "$SOURCE_SHA" '.sourceSha == $sha and (.apiDigest | test("^sha256:[0-9a-f]{64}$")) and (.webDigest | test("^sha256:[0-9a-f]{64}$")) and (.runId | test("^[1-9][0-9]*$")) and (.runAttempt | test("^[1-9][0-9]*$")) and (.deploymentId | length > 0)' <<<"$marker" >/dev/null; then
            api="$(curl --fail --silent --show-error "$public_origin/api/health" || true)"; web="$(curl --fail --silent --show-error "$public_origin/" || true)"
            if jq -e '.status == "ok" and .db == "up"' <<<"$api" >/dev/null && grep -Eqi '<title>Unshelf</title>' <<<"$web" && grep -Eqi "id=(\"root\"|'root')" <<<"$web"; then deploy=false; fi
          fi
          printf 'deploy=%s\ncompose_id=%s\nruntime_name=%s\npublic_origin=%s\n' "$deploy" "$compose_id" "$runtime_name" "$public_origin" >>"$GITHUB_OUTPUT"

  api-image:
    needs: inspect
    if: needs.inspect.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: { contents: read, packages: write }
    outputs: { digest: "${{ steps.publish.outputs.digest }}" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          {
            ref: "${{ needs.inspect.outputs.source_sha }}",
            persist-credentials: false,
          }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          {
            registry: ghcr.io,
            username: "${{ github.actor }}",
            password: "${{ secrets.GITHUB_TOKEN }}",
          }
      - id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/rajat2006/unshelf-api:preview-pr-${{ needs.inspect.outputs.pr_number }}-${{ needs.inspect.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}

  web-image:
    needs: inspect
    if: needs.inspect.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: { contents: read, packages: write }
    outputs: { digest: "${{ steps.publish.outputs.digest }}" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          {
            ref: "${{ needs.inspect.outputs.source_sha }}",
            persist-credentials: false,
          }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          {
            registry: ghcr.io,
            username: "${{ github.actor }}",
            password: "${{ secrets.GITHUB_TOKEN }}",
          }
      - id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/rajat2006/unshelf-web:preview-pr-${{ needs.inspect.outputs.pr_number }}-${{ needs.inspect.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ vars.VITE_CLERK_PUBLISHABLE_KEY_NONPRODUCTION }}
            VITE_YOUTUBE_OEMBED_ENABLED=true

  deploy:
    needs: [authorize, inspect, api-image, web-image]
    if: always() && needs.inspect.result == 'success' && (needs.inspect.outputs.deploy == 'false' || (needs.api-image.result == 'success' && needs.web-image.result == 'success'))
    environment: preview
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - if: needs.inspect.outputs.deploy == 'false'
        name: Record a healthy no-op
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
          COMPOSE_ID: ${{ needs.inspect.outputs.compose_id }}
          LOGICAL_NAME: ${{ needs.authorize.outputs.logical_name }}
          RUNTIME_NAME: ${{ needs.inspect.outputs.runtime_name }}
        run: |
          printf '### Preview delivery\n\n- State: healthy no-op\n- Source: `%s`\n- Compose: `%s` (`%s`, runtime `%s`)\n' "$SOURCE_SHA" "$LOGICAL_NAME" "$COMPOSE_ID" "$RUNTIME_NAME" >>"$GITHUB_STEP_SUMMARY"
      - if: needs.inspect.outputs.deploy == 'true'
        name: Create or refresh the exact preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
          TRUSTED_SHA: ${{ needs.authorize.outputs.trusted_sha }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
          LOGICAL_NAME: ${{ needs.authorize.outputs.logical_name }}
          API_DIGEST: ${{ needs.api-image.outputs.digest }}
          WEB_DIGEST: ${{ needs.web-image.outputs.digest }}
          DOKPLOY_URL: ${{ vars.DOKPLOY_NONPRODUCTION_URL }}
          ENVIRONMENT_ID: ${{ vars.DOKPLOY_PREVIEW_ENV_ID }}
          DOMAIN_SUFFIX: ${{ vars.DOKPLOY_PREVIEW_DOMAIN_SUFFIX }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_NONPRODUCTION_API_KEY }}
          DOKPLOY_COMPOSE_ENV: ${{ secrets.DOKPLOY_PREVIEW_COMPOSE_ENV }}
        run: |
          set -euo pipefail
          [[ "$API_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] && [[ "$WEB_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          public_origin="https://pr-${PR_NUMBER}.${DOMAIN_SUFFIX}"
          policy="$RUNNER_TEMP/delivery-policy.mjs"
          gh api "repos/${GITHUB_REPOSITORY}/contents/.github/scripts/delivery-policy.mjs?ref=${TRUSTED_SHA}" --jq .content | base64 --decode >"$policy"
          records="$(curl --fail --silent --show-error -H "x-api-key: $DOKPLOY_API_KEY" --get --data-urlencode "environmentId=$ENVIRONMENT_ID" --data-urlencode 'limit=100' "$DOKPLOY_URL/api/compose.search")"
          # Repeat exact lookup under the global preview lock; a substring match cannot authorize mutation (ADR-0022).
          selection="$(jq -n --argjson records "$records" --arg logicalName "$LOGICAL_NAME" --argjson prNumber "$PR_NUMBER" '{records:$records,logicalName:$logicalName,prNumber:$prNumber}' | node "$policy" select-preview)"
          compose_id="$(jq -r '.composeId // ""' <<<"$selection")"
          if test -z "$compose_id"; then
            create_body="$(jq -n --arg name "$LOGICAL_NAME" --arg environmentId "$ENVIRONMENT_ID" '{name:$name,appName:$name,description:"",environmentId:$environmentId,sourceType:"raw",composeType:"docker-compose",composeFile:"services: {}"}')"
            created="$(curl --fail --silent --show-error -H "x-api-key: $DOKPLOY_API_KEY" -H 'content-type: application/json' --data "$create_body" "$DOKPLOY_URL/api/compose.create")"
            compose_id="$(jq -er '.. | objects | .composeId? // empty' <<<"$created" | head -n1)"
          fi
          record="$(curl --fail --silent --show-error -H "x-api-key: $DOKPLOY_API_KEY" --get --data-urlencode "composeId=$compose_id" "$DOKPLOY_URL/api/compose.one")"
          test "$(jq -r '.result.data.json.composeId // .composeId' <<<"$record")" = "$compose_id"
          test "$(jq -r '.result.data.json.name // .name' <<<"$record")" = "$LOGICAL_NAME"
          runtime_name="$(jq -er '.. | objects | .appName? // empty' <<<"$record" | head -n1)"
          [[ "$runtime_name" =~ ^unshelf-pr-${PR_NUMBER}-[A-Za-z0-9_-]{6}$ ]]
          compose_file="$(gh api "repos/${GITHUB_REPOSITORY}/contents/docker-compose.yml?ref=${TRUSTED_SHA}" --jq .content | base64 --decode)"
          env_file="${DOKPLOY_COMPOSE_ENV%$'\n'}"$'\n'"API_IMAGE=ghcr.io/rajat2006/unshelf-api@$API_DIGEST"$'\n'"WEB_IMAGE=ghcr.io/rajat2006/unshelf-web@$WEB_DIGEST"$'\n'"PUBLIC_ORIGIN=$public_origin"$'\n'"APPLICATION_NAME=$LOGICAL_NAME"$'\n'"DATABASE_NETWORK=unshelf-nonprod-db"
          body="$(jq -n --arg composeId "$compose_id" --arg composeFile "$compose_file" --arg env "$env_file" '{composeId:$composeId,composeFile:$composeFile,env:$env,sourceType:"raw",composeType:"docker-compose",isolatedDeployment:true}')"
          curl --fail --silent --show-error -H "x-api-key: $DOKPLOY_API_KEY" -H 'content-type: application/json' --data "$body" "$DOKPLOY_URL/api/compose.update" >/dev/null
          domains="$(curl --fail --silent --show-error -H "x-api-key: $DOKPLOY_API_KEY" --get --data-urlencode "composeId=$compose_id" "$DOKPLOY_URL/api/domain.byComposeId")"
          domain_list="$(jq -c '[.. | arrays | .[]? | objects | select(has("domainId") and has("host"))] | unique_by(.domainId)' <<<"$domains")"
          missing="$(jq -n --argjson domains "$domain_list" --arg composeId "$compose_id" --arg host "pr-${PR_NUMBER}.${DOMAIN_SUFFIX}" '{domains:$domains,composeId:$composeId,host:$host}' | node "$policy" reconcile-domains)"
          while IFS= read -r route; do
            service="$(jq -r .serviceName <<<"$route")"; port="$(jq -r .port <<<"$route")"; path="$(jq -r .path <<<"$route")"
              domain_body="$(jq -n --arg composeId "$compose_id" --arg host "pr-${PR_NUMBER}.${DOMAIN_SUFFIX}" --arg path "$path" --arg serviceName "$service" --argjson port "$port" '{composeId:$composeId,domainType:"compose",host:$host,path:$path,serviceName:$serviceName,port:$port,https:true,certificateType:"letsencrypt",stripPath:false}')"
              curl --fail --silent --show-error -H "x-api-key: $DOKPLOY_API_KEY" -H 'content-type: application/json' --data "$domain_body" "$DOKPLOY_URL/api/domain.create" >/dev/null
          done < <(jq -c '.[]' <<<"$missing")
          title="preview-pr-$PR_NUMBER:$SOURCE_SHA:run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"; description="channel=preview pr=$PR_NUMBER source=$SOURCE_SHA run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
          deploy_body="$(jq -n --arg composeId "$compose_id" --arg title "$title" --arg description "$description" '{composeId:$composeId,title:$title,description:$description}')"
          curl --fail --silent --show-error -H "x-api-key: $DOKPLOY_API_KEY" -H 'content-type: application/json' --data "$deploy_body" "$DOKPLOY_URL/api/compose.deploy" >/dev/null
          status=missing; deployment_id=""
          for _ in $(seq 1 120); do
            records="$(curl --fail --silent --show-error -H "x-api-key: $DOKPLOY_API_KEY" --get --data-urlencode "composeId=$compose_id" "$DOKPLOY_URL/api/deployment.allByCompose")"
            matches="$(jq -c --arg title "$title" --arg id "$compose_id" '[.. | objects | select(.title? == $title and .composeId? == $id)] | unique_by(.deploymentId)' <<<"$records")"
            test "$(jq 'length' <<<"$matches")" -le 1
            status="$(jq -r '.[0].status // "missing"' <<<"$matches")"; deployment_id="$(jq -r '.[0].deploymentId // ""' <<<"$matches")"
            test "$status" != error && test "$status" != cancelled
            test "$status" = "done" && break; sleep 5
          done
          test "$status" = "done"
          healthy=false
          for _ in $(seq 1 24); do
            api="$(curl --fail --silent --show-error "$public_origin/api/health" || true)"; web="$(curl --fail --silent --show-error "$public_origin/" || true)"
            if jq -e '.status == "ok" and .db == "up"' <<<"$api" >/dev/null && grep -Eqi '<title>Unshelf</title>' <<<"$web" && grep -Eqi "id=(\"root\"|'root')" <<<"$web"; then healthy=true; break; fi
            sleep 5
          done
          test "$healthy" = true
          marker="$(jq -cn --arg sourceSha "$SOURCE_SHA" --arg apiDigest "$API_DIGEST" --arg webDigest "$WEB_DIGEST" --arg runId "$GITHUB_RUN_ID" --arg runAttempt "$GITHUB_RUN_ATTEMPT" --arg deploymentId "$deployment_id" '{sourceSha:$sourceSha,apiDigest:$apiDigest,webDigest:$webDigest,runId:$runId,runAttempt:$runAttempt,deploymentId:$deploymentId}')"
          marker_body="$(jq -n --arg composeId "$compose_id" --arg description "unshelf:last-healthy $marker" '{composeId:$composeId,description:$description}')"
          curl --fail --silent --show-error -H "x-api-key: $DOKPLOY_API_KEY" -H 'content-type: application/json' --data "$marker_body" "$DOKPLOY_URL/api/compose.update" >/dev/null
          printf '### Preview delivery\n\n- State: healthy\n- Source: `%s`\n- Compose: `%s` (`%s`, runtime `%s`)\n- API digest: `%s`\n- Web digest: `%s`\n- Deployment: `%s`\n- Lifecycle: deletion remains a manual Dokploy action after capturing these identities.\n' "$SOURCE_SHA" "$LOGICAL_NAME" "$compose_id" "$runtime_name" "$API_DIGEST" "$WEB_DIGEST" "$deployment_id" >>"$GITHUB_STEP_SUMMARY"

  summarize:
    needs: [authorize, inspect, api-image, web-image, deploy]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: { actions: read }
    steps:
      - name: Record allowlisted final evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
          API_DIGEST: ${{ needs.api-image.outputs.digest }}
          WEB_DIGEST: ${{ needs.web-image.outputs.digest }}
          COMPOSE_ID: ${{ needs.inspect.outputs.compose_id }}
          COMPOSE_NAME: ${{ needs.authorize.outputs.logical_name }}
          RUNTIME_NAME: ${{ needs.inspect.outputs.runtime_name }}
          GATES: authorize=${{ needs.authorize.result }},inspect=${{ needs.inspect.result }},api-image=${{ needs.api-image.result }},web-image=${{ needs.web-image.result }},deploy=${{ needs.deploy.result }}
        run: |
          started="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .run_started_at)"
          duration="$(( $(date +%s) - $(date -d "$started" +%s) ))s"
          final_state=success; [[ "$GATES" == *failure* ]] && final_state=failure; [[ "$GATES" == *cancelled* ]] && final_state=cancelled
          printf '### Preview final evidence\n\n- Channel: preview\n- Final state: `%s`\n- Selected SHA: `%s`\n- Digests: API `%s`, web `%s`\n- Gates/health: `%s`\n- Duration: `%s`\n- Compose: `%s` (`%s`, runtime `%s`)\n' "$final_state" "${SOURCE_SHA:-unavailable}" "${API_DIGEST:-not-built}" "${WEB_DIGEST:-not-built}" "$GATES" "$duration" "${COMPOSE_NAME:-unresolved}" "${COMPOSE_ID:-unresolved}" "${RUNTIME_NAME:-unresolved}" >>"$GITHUB_STEP_SUMMARY"
