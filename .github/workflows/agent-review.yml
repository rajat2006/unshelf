name: Agent Review

# The review leg of the chain (spec #52 / #65): applying `agent:review` to a PR
# runs the repo's local `/code-review`, posts the findings, and marks the PR
# ready. implement adds this label via AGENT_PAT so the chain fires automatically
# (implement → review → ready). The agent only produces an output file — this
# workflow owns every git, `gh`, and label mutation (spec invariant H).

on:
  pull_request_target:
    types: [labeled]

jobs:
  review:
    if: github.event.label.name == 'agent:review'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      # SHARED per-PR group across every PR-mutating capability (review /
      # implement-pr / update-branch), keyed on the PR number, so they queue
      # rather than double-mutate the same PR. Queues, never cancels — an
      # in-flight run is not killed (spec §68).
      group: agent-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Gate — read the PR label set, provider, and originating issue
        id: gate
        run: |
          set -euo pipefail
          # Full PR label set (AC: resolve the provider from the whole set, not
          # just the just-added trigger label).
          labels_json=$(gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name]')
          echo "labels_json=$labels_json" >> "$GITHUB_OUTPUT"

          # Provider switch (spec #64): mirror resolveAgent() so the workflow's
          # provider-specific setup matches what the runner resolves.
          if echo "$labels_json" | jq -e 'index("agent:codex")' >/dev/null; then
            echo "is_codex=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_codex=false" >> "$GITHUB_OUTPUT"
          fi

          # Defensive re-check: the trigger label must still be present (it could
          # have been removed between the event and this run).
          if ! echo "$labels_json" | jq -e 'index("agent:review")' >/dev/null; then
            echo "agent:review no longer on the PR — skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "refusal=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # SECURITY: this workflow runs under `pull_request_target`, so the base
          # repo's secrets (CLAUDE_CODE_OAUTH_TOKEN / CODEX_AUTH_JSON / AGENT_PAT)
          # are in scope. Refuse fork PRs so their (untrusted) head code is never
          # checked out and executed with those secrets available. The
          # implement → review chain only ever produces same-repo `agent/issue-*`
          # branches, so this refuses nothing the automation creates.
          is_cross=$(gh pr view "$PR_NUMBER" --json isCrossRepository --jq '.isCrossRepository')
          if [ "$is_cross" = "true" ]; then
            echo "PR is from a fork — refusing review under pull_request_target."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "refusal=fork" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The PR head branch is what we check out and diff against origin/main.
          head_ref=$(gh pr view "$PR_NUMBER" --json headRefName --jq '.headRefName')
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"

          # Resolve the originating issue from the PR body ("Closes #N") so the
          # review prompt reads the right spec. Fall back to the PR itself when a
          # PR opens no issue link — /code-review then leans on commit messages.
          pr_body=$(gh pr view "$PR_NUMBER" --json body --jq '.body')
          issue_number=$(printf '%s' "$pr_body" \
            | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+' | head -n1 || true)
          if [ -n "$issue_number" ]; then
            issue_title=$(gh issue view "$issue_number" --json title --jq '.title' 2>/dev/null || echo "")
          else
            issue_number="$PR_NUMBER"
            issue_title=$(gh pr view "$PR_NUMBER" --json title --jq '.title')
          fi
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "issue_title=$issue_title" >> "$GITHUB_OUTPUT"

          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "refusal=" >> "$GITHUB_OUTPUT"

      - name: Refuse — PR is from a fork
        if: steps.gate.outputs.refusal == 'fork'
        run: |
          set -euo pipefail
          gh pr edit "$PR_NUMBER" --remove-label "agent:review" || true
          gh pr comment "$PR_NUMBER" --body "Refused to run \`agent:review\`: this PR is from a fork. The review workflow runs under \`pull_request_target\` with repository secrets in scope, so it deliberately does not check out or execute fork head code. A maintainer can review it manually. Cleared \`agent:review\`."

      - name: Checkout the PR branch
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.head_ref }}
          fetch-depth: 0
          # AGENT_PAT keeps parity with implement's checkout; the review makes no
          # push, so GITHUB_TOKEN would also do. Falls back when AGENT_PAT unset.
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

      - name: Fetch the review base (origin/main)
        if: steps.gate.outputs.proceed == 'true'
        # Explicit dest refspec so `origin/main` resolves for `git diff
        # origin/main...HEAD`, whatever narrow refspec the checkout left behind.
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Setup pnpm
        if: steps.gate.outputs.proceed == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Claude Code
        if: steps.gate.outputs.proceed == 'true'
        run: npm install -g @anthropic-ai/claude-code

      # Codex CLI only when this PR opted in via `agent:codex`; the Claude default
      # never pays for it. Runner-side auth is materialised by prepareCodexAuth.
      - name: Install Codex CLI
        if: steps.gate.outputs.proceed == 'true' && steps.gate.outputs.is_codex == 'true'
        run: npm install -g @openai/codex

      - name: Run review
        if: steps.gate.outputs.proceed == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Codex subscription seat — ignored on the Claude default; prepareCodexAuth
          # writes $CODEX_HOME/auth.json only when Codex is resolved. OPENAI_KEY /
          # OPENAI_API_KEY are deliberately NOT passed (spec #64).
          CODEX_HOME: ${{ runner.temp }}/.codex
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          AGENT_LABELS: ${{ steps.gate.outputs.labels_json }}
          ISSUE_NUMBER: ${{ steps.gate.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.gate.outputs.issue_title }}
          BRANCH: ${{ steps.gate.outputs.head_ref }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: pnpm exec tsx .sandcastle/review/review.ts

      - name: Post findings on the PR
        if: steps.gate.outputs.proceed == 'true' && success()
        run: gh pr comment "$PR_NUMBER" --body-file "${RUNNER_TEMP}/review_comment.md"

      - name: Mark the PR ready for review
        if: steps.gate.outputs.proceed == 'true' && success()
        # Idempotent: `gh pr ready` errors on an already-ready PR, which would flip
        # the job to failed and post a contradictory "run failed" comment after we
        # already posted the findings. Only convert when it is still a draft.
        run: |
          set -euo pipefail
          if [ "$(gh pr view "$PR_NUMBER" --json isDraft --jq '.isDraft')" = "true" ]; then
            gh pr ready "$PR_NUMBER"
          else
            echo "PR #$PR_NUMBER is already ready — nothing to do."
          fi

      - name: Comment on failure
        # `failure()` covers crashes and the idle watchdog; `cancelled()` covers a
        # hard 60-min timeout breach. The PR is left as a draft (not marked ready)
        # so a stalled review can't be mistaken for a passed one.
        if: steps.gate.outputs.proceed == 'true' && (failure() || cancelled())
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          {
            printf '%s\n\n' '`agent:review` run failed — the PR was left as a draft.'
            printf '**Workflow run:** %s\n\n' "$RUN_URL"
            printf '%s\n' 'Re-add `agent:review` to retry.'
          } > "${RUNNER_TEMP}/review_failed.md"
          gh pr comment "$PR_NUMBER" --body-file "${RUNNER_TEMP}/review_failed.md" || true

      - name: Always remove agent:review
        # Clear the trigger whatever the outcome, so a retry is a clean re-add
        # (mirrors implement clearing its own trigger label).
        if: always() && steps.gate.outputs.proceed == 'true'
        run: gh pr edit "$PR_NUMBER" --remove-label "agent:review" || true
