name: Deploy development

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current dev commit to deploy
        required: true
        type: string

permissions:
  contents: read

# GitHub keeps at most one pending run for this target and replaces an older
# pending run with the newest. The active run is never canceled, so Dokploy can
# finish remote work before the newest desired dev SHA is reconciled.
concurrency:
  group: development-deployment
  cancel-in-progress: false

jobs:
  deploy:
    environment: development
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      APPROVED_CHANNEL: development
      APPROVED_SOURCE_SHA: ${{ inputs.source_sha }}
      APPROVED_EVENT: workflow_run
      APPROVED_HEAD_BRANCH: dev
      APPROVED_HEAD_REPOSITORY: ${{ github.repository }}
      APPROVED_CANDIDATE_CONCLUSION: success
      DEPLOYMENT_ENVIRONMENT: development
      DOKPLOY_URL: ${{ vars.DOKPLOY_NONPRODUCTION_URL }}
      DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_DEVELOPMENT_COMPOSE_ID }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_NONPRODUCTION_API_KEY }}
      DOKPLOY_COMPOSE_ENV: ${{ secrets.DOKPLOY_DEVELOPMENT_COMPOSE_ENV }}
      PUBLIC_ORIGIN: ${{ vars.DEVELOPMENT_PUBLIC_ORIGIN }}

    steps:
      - name: Check out trusted development control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: dev
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install trusted control-plane dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build trusted control plane
        run: pnpm --filter @unshelf/deployment-control-plane build

      - name: Log in to private GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable development pair
        env:
          API_TRACE: ghcr.io/rajat2006/unshelf-api:development-${{ env.SOURCE_SHA }}
          WEB_TRACE: ghcr.io/rajat2006/unshelf-web:development-${{ env.SOURCE_SHA }}
        run: |
          set -euo pipefail
          api_digest="$(docker buildx imagetools inspect "$API_TRACE" --format '{{.Manifest.Digest}}')"
          web_digest="$(docker buildx imagetools inspect "$WEB_TRACE" --format '{{.Manifest.Digest}}')"
          printf 'API_IMAGE=ghcr.io/rajat2006/unshelf-api@%s\n' "$api_digest" >> "$GITHUB_ENV"
          printf 'WEB_IMAGE=ghcr.io/rajat2006/unshelf-web@%s\n' "$web_digest" >> "$GITHUB_ENV"

      - name: Reconcile hosted development
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          node packages/deployment-control-plane/dist/cli.js reconcile
          --channel development
          --source-sha "$SOURCE_SHA"
          --api-image "$API_IMAGE"
          --web-image "$WEB_IMAGE"
          --public-origin "$PUBLIC_ORIGIN"
          --correlation "development:$SOURCE_SHA:run-$GITHUB_RUN_ID"
