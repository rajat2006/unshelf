name: Agent Implement

# The core spine (spec #52 / #63): applying `agent:implement` to a normal issue
# runs one autonomous implementation and opens an auto-reviewed DRAFT PR. The
# agent only produces commits + output files — this workflow owns every git,
# `gh`, and label mutation.

on:
  issues:
    types: [labeled]

# Cheap event filter: only the `agent:implement` labeled event enters the job.
# The gate step below re-reads the FULL label set (spec AC: read the whole set,
# not just the just-added label) and resolves the provider from it.
jobs:
  implement:
    if: github.event.label.name == 'agent:implement'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      # Per-issue serialisation that QUEUES rather than cancels — two triggers on
      # the same issue run one after another, never concurrently, and an
      # in-flight run is never killed. `queue: max` is required for this: the
      # default `queue: single` keeps only ONE pending run, so a third trigger
      # would evict the second rather than lining up behind it.
      group: agent-implement-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pull-requests: write
      issues: write

    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Gate — read the full label set and issue shape
        id: gate
        run: |
          set -euo pipefail
          # Full label set (AC: read the whole set, not just the trigger label).
          labels_json=$(gh issue view "$ISSUE_NUMBER" --json labels --jq '[.labels[].name]')
          echo "labels_json=$labels_json" >> "$GITHUB_OUTPUT"

          # Provider switch (spec #64): `agent:codex` present ⇒ run on Codex, which
          # needs the codex CLI installed and the subscription seat materialised.
          # Absent ⇒ Claude Code default. Mirrors resolveAgent() so the workflow's
          # provider-specific setup matches what the runner resolves.
          if echo "$labels_json" | jq -e 'index("agent:codex")' >/dev/null; then
            echo "is_codex=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_codex=false" >> "$GITHUB_OUTPUT"
          fi

          # Defensive re-check: the trigger label must still be present (it could
          # have been removed between the event and this run).
          if ! echo "$labels_json" | jq -e 'index("agent:implement")' >/dev/null; then
            echo "agent:implement no longer on the issue — skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "refusal=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # THE SHAPE FETCH — fail CLOSED, never guess. An issue with no
          # sub-issues returns `200 []` (exit 0); only a genuine API/auth/network
          # failure exits non-zero. Retry to ride out transient blips, then treat a
          # persistent failure as an ERROR (refuse) — NOT as "no sub-issues", which
          # would let this leaf path implement a real PRD as one monolithic issue.
          # The PRD workflow's detect fails closed the same way, so the two never
          # both proceed on an unknown shape.
          sub_issues_json=""
          fetch_ok=false
          for attempt in 1 2 3; do
            if sub_issues_json=$(gh api "repos/${GH_REPO}/issues/${ISSUE_NUMBER}/sub_issues" 2>/dev/null); then
              fetch_ok=true
              break
            fi
            echo "sub_issues fetch attempt ${attempt} failed; retrying…"
            sleep 3
          done
          if [ "$fetch_ok" != "true" ]; then
            echo "Could not determine issue shape after retries — failing closed."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "refusal=shape-error" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sub_count=$(echo "$sub_issues_json" | jq 'length')

          # PRDs (issues with sub-issues) are handled by the PRD workflow, which
          # listens for the SAME labeled event — SILENTLY skip so we neither race
          # it nor strip its trigger label. Do not comment or edit labels here.
          if [ "$sub_count" != "0" ]; then
            echo "Issue has sub-issues (PRD) — silent skip; the PRD flow handles it."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "refusal=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Sub-issues (issues WITH a parent) belong to the parent PRD, which owns
          # the run — you label the parent, not the child. Refuse below. The parent
          # is queried via GraphQL; the REST issue object doesn't expose it. This
          # probe fails CLOSED like the sub-issue fetch above — a missing parent is
          # exit 0 with empty output; only a genuine API failure exits non-zero,
          # and after retries that refuses (shape-error) rather than being read as
          # "no parent", which would let a directly-labelled sub-issue through.
          owner="${GH_REPO%/*}"
          repo="${GH_REPO#*/}"
          parent_number=""
          parent_ok=false
          for attempt in 1 2 3; do
            if parent_number=$(gh api graphql \
                 -f query='query($owner: String!, $repo: String!, $num: Int!) { repository(owner: $owner, name: $repo) { issue(number: $num) { parent { number } } } }' \
                 -f owner="$owner" -f repo="$repo" -F num="$ISSUE_NUMBER" \
                 --jq '.data.repository.issue.parent.number // empty' 2>/dev/null); then
              parent_ok=true
              break
            fi
            echo "parent-shape probe attempt ${attempt} failed; retrying…"
            sleep 3
          done
          if [ "$parent_ok" != "true" ]; then
            echo "Could not determine parent shape after retries — failing closed."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "refusal=shape-error" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$parent_number" ]; then
            echo "Issue is a sub-issue of #${parent_number} — refusing direct run."
            echo "parent_number=$parent_number" >> "$GITHUB_OUTPUT"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "refusal=subissue" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Pre-flight: if an open PR already closes this issue, refuse rather than
          # force-push a second branch and collide on `gh pr create`. Keeps the
          # one-issue → one-branch → one-PR invariant.
          existing=$(gh pr list --state open \
            --search "in:body \"#${ISSUE_NUMBER}\"" \
            --json url,body \
            --jq "[.[] | select(.body | test(\"(?i)(closes|fixes|resolves)\\\\s+#${ISSUE_NUMBER}\\\\b\"))]")
          if [ "$(echo "$existing" | jq 'length')" -gt 0 ]; then
            echo "existing_pr_url=$(echo "$existing" | jq -r '.[0].url')" >> "$GITHUB_OUTPUT"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "refusal=existing_pr" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "refusal=" >> "$GITHUB_OUTPUT"

      - name: Refuse — could not determine issue shape
        if: steps.gate.outputs.refusal == 'shape-error'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true
          gh issue comment "$ISSUE_NUMBER" --body "Refused to run \`agent:implement\`: could not read this issue's sub-issue shape after retries (a transient GitHub API failure). Nothing was routed, to avoid implementing a PRD as a single issue. Clear \`agent:blocked\` and re-add \`agent:implement\` to retry. Run: ${RUN_URL}"

      - name: Refuse — issue is a sub-issue of another issue
        if: steps.gate.outputs.refusal == 'subissue'
        env:
          PARENT_NUMBER: ${{ steps.gate.outputs.parent_number }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true
          gh issue comment "$ISSUE_NUMBER" --body "Refused to run \`agent:implement\`: this issue is a sub-issue of #${PARENT_NUMBER}. Sub-issues are not labeled directly — add \`agent:implement\` to the parent PRD instead. Cleared \`agent:implement\` and added \`agent:blocked\`."

      - name: Refuse — an open PR already targets this issue
        if: steps.gate.outputs.refusal == 'existing_pr'
        env:
          EXISTING_PR_URL: ${{ steps.gate.outputs.existing_pr_url }}
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
          gh issue comment "$ISSUE_NUMBER" --body "Refused to run \`agent:implement\`: PR ${EXISTING_PR_URL} already targets this issue. Close it first, then re-add \`agent:implement\`."

      - name: Transition labels — remove implement/blocked, add in-progress
        if: steps.gate.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:blocked" || true
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:in-progress"

      - name: Checkout main
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # AGENT_PAT so a push may include changes under .github/workflows/
          # (GITHUB_TOKEN lacks the `workflows` scope). Falls back to
          # GITHUB_TOKEN when AGENT_PAT is unset — workflow-file changes are then
          # rejected on push, but ordinary code changes still land.
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

      - name: Compute branch name
        if: steps.gate.outputs.proceed == 'true'
        id: branch
        run: |
          set -euo pipefail
          # Strip leading/trailing dashes AFTER truncating, so a cut through a
          # separator can't leave a trailing dash; fall back for empty slugs
          # (e.g. an all-punctuation title).
          slug=$(echo "$ISSUE_TITLE" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g' \
            | cut -c1-50 \
            | sed -E 's/^-+|-+$//g')
          [ -z "$slug" ] && slug="untitled"
          echo "name=agent/issue-${ISSUE_NUMBER}-${slug}" >> "$GITHUB_OUTPUT"

      - name: Create branch
        if: steps.gate.outputs.proceed == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          git config user.name "unshelf-agent[bot]"
          git config user.email "unshelf-agent[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

      - name: Setup pnpm
        if: steps.gate.outputs.proceed == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Claude Code
        if: steps.gate.outputs.proceed == 'true'
        run: npm install -g @anthropic-ai/claude-code

      # Codex CLI only when this issue opted in via `agent:codex` — the Claude
      # default never pays for it. Runner-side auth (auth.json + file credential
      # store) is materialised by `prepareCodexAuth` inside the run scripts.
      - name: Install Codex CLI
        if: steps.gate.outputs.proceed == 'true' && steps.gate.outputs.is_codex == 'true'
        run: npm install -g @openai/codex

      - name: Run implement
        if: steps.gate.outputs.proceed == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Codex subscription seat. Ignored on the Claude default; the run script's
          # prepareCodexAuth writes $CODEX_HOME/auth.json only when Codex is
          # resolved. OPENAI_KEY / OPENAI_API_KEY are deliberately NOT passed —
          # their presence would push Codex onto the metered API (spec #64).
          CODEX_HOME: ${{ runner.temp }}/.codex
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          AGENT_LABELS: ${{ steps.gate.outputs.labels_json }}
          BRANCH: ${{ steps.branch.outputs.name }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: pnpm --dir .sandcastle exec tsx implement/implement.ts

      - name: Push branch
        if: steps.gate.outputs.proceed == 'true' && success()
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        # Force-push: the branch name is deterministic from the issue number, so
        # any pre-existing remote ref is an orphan from an earlier run.
        run: git push --force origin "$BRANCH"

      - name: Write PR title and description
        if: steps.gate.outputs.proceed == 'true' && success()
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Same subscription seat as the implement step — this phase runs the
          # agent too. See the note above; OPENAI_KEY / OPENAI_API_KEY stay unset.
          CODEX_HOME: ${{ runner.temp }}/.codex
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          AGENT_LABELS: ${{ steps.gate.outputs.labels_json }}
          BRANCH: ${{ steps.branch.outputs.name }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: pnpm --dir .sandcastle exec tsx write-pr/write-pr.ts

      - name: Open draft PR
        if: steps.gate.outputs.proceed == 'true' && success()
        id: open_pr
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          pr_title=$(head -c 256 "${RUNNER_TEMP}/pr_title.txt")
          pr_url=$(gh pr create \
            --draft \
            --base main \
            --head "$BRANCH" \
            --title "$pr_title" \
            --body-file "${RUNNER_TEMP}/pr_description.txt")
          echo "pr_number=$(basename "$pr_url")" >> "$GITHUB_OUTPUT"

      - name: Propagate provider label (agent:codex) to the PR
        if: steps.gate.outputs.proceed == 'true' && success() && steps.gate.outputs.is_codex == 'true'
        env:
          PR_NUMBER: ${{ steps.open_pr.outputs.pr_number }}
        # Provider continuity (spec §C/#64): the review workflow resolves its
        # provider from the PR's OWN label set, so a Codex-implemented issue must
        # carry agent:codex onto the PR — otherwise its review silently falls back
        # to Claude. Added BEFORE agent:review below so it is already present when
        # the review gate reads the PR labels. GITHUB_TOKEN is fine here:
        # agent:codex triggers no downstream workflow (only agent:review does).
        run: gh pr edit "$PR_NUMBER" --add-label "agent:codex"

      - name: Request automated review (add agent:review)
        if: steps.gate.outputs.proceed == 'true' && success()
        env:
          PR_NUMBER: ${{ steps.open_pr.outputs.pr_number }}
          # AGENT_PAT so the labeled event triggers the downstream review
          # workflow — a GITHUB_TOKEN-applied label never triggers one. Falls
          # back to GITHUB_TOKEN; a human then re-adds agent:review to fire it.
          AGENT_PAT: ${{ secrets.AGENT_PAT }}
        run: |
          set -uo pipefail
          if [ -n "${AGENT_PAT:-}" ]; then
            if GH_TOKEN="$AGENT_PAT" gh pr edit "$PR_NUMBER" --add-label "agent:review"; then
              exit 0
            fi
            echo "AGENT_PAT label add failed; falling back to GITHUB_TOKEN (review will need a manual re-label)."
          fi
          gh pr edit "$PR_NUMBER" --add-label "agent:review"

      - name: Mark blocked on failure
        # `failure()` covers crashes and the idle watchdog (a non-zero tsx exit).
        # `cancelled()` covers the hard 60-min job `timeout-minutes` breach, which
        # cancels rather than fails the job — without it, a timed-out run would
        # never reach the blocked path (spec: "any stop … moves the issue to
        # agent:blocked").
        if: steps.gate.outputs.proceed == 'true' && (failure() || cancelled())
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          reason="(no reason file written — check the workflow logs)"
          if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
          fi
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true
          {
            printf '%s\n\n' '`agent:implement` run failed.'
            printf '**Reason:** %s\n\n' "$reason"
            printf '**Workflow run:** %s\n\n' "$RUN_URL"
            printf '%s\n' 'Clear `agent:blocked` and re-add `agent:implement` to retry.'
          } > "${RUNNER_TEMP}/blocked_comment.md"
          gh issue comment "$ISSUE_NUMBER" --body-file "${RUNNER_TEMP}/blocked_comment.md"

      - name: Always remove in-progress
        if: always() && steps.gate.outputs.proceed == 'true'
        run: gh issue edit "$ISSUE_NUMBER" --remove-label "agent:in-progress" || true
