name: Publish candidate images

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit to publish
        required: true
        type: string
      source_event:
        description: Product CI event that approved the source
        required: true
        type: choice
        options: [push, pull_request]
      head_branch:
        description: Branch containing the exact source commit
        required: true
        type: string

# Product CI is deliberately secret-free. The trusted preflight rejects stale
# branch and pull-request heads and requires their exact successful CI run
# before either package-write job starts.
permissions:
  contents: read

concurrency:
  group: candidate-${{ inputs.source_event }}-${{ inputs.head_branch }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  SOURCE_EVENT: ${{ inputs.source_event }}
  HEAD_BRANCH: ${{ inputs.head_branch }}
  CHANNEL: ${{ inputs.source_event == 'push' && inputs.head_branch == 'dev' && 'development' || inputs.source_event == 'push' && inputs.head_branch == 'main' && 'production' || 'preview' }}
  TRACE: ${{ inputs.source_event == 'push' && inputs.head_branch == 'dev' && 'development' || inputs.source_event == 'push' && inputs.head_branch == 'main' && 'production' || 'preview' }}-${{ inputs.source_sha }}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      packages: read

    steps:
      - name: Check out trusted control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: dev
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install trusted control-plane dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build trusted control plane
        run: pnpm --filter @unshelf/deployment-control-plane build

      - name: Log in to private GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify approved intent and unused trace identities
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPROVED_CHANNEL: ${{ env.CHANNEL }}
          APPROVED_SOURCE_SHA: ${{ env.SOURCE_SHA }}
          APPROVED_EVENT: ${{ env.SOURCE_EVENT }}
          APPROVED_HEAD_BRANCH: ${{ env.HEAD_BRANCH }}
          APPROVED_HEAD_REPOSITORY: ${{ github.repository }}
        run: >-
          node packages/deployment-control-plane/dist/cli.js prepare-candidate
          --channel "$CHANNEL"
          --source-sha "$SOURCE_SHA"

      - name: Verify exact successful Product CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SOURCE_SHA}&status=completed&per_page=100")"
          jq -e \
            --arg sha "$SOURCE_SHA" \
            --arg event "$SOURCE_EVENT" \
            --arg branch "$HEAD_BRANCH" \
            '.workflow_runs | any(.head_sha == $sha and .head_branch == $branch and .event == $event and .conclusion == "success")' \
            <<< "$runs" > /dev/null

  api-image:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}

    steps:
      - name: Check out the approved source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to private GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API trace image
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/rajat2006/unshelf-api:${{ env.TRACE }}
          labels: |
            org.opencontainers.image.source=https://github.com/rajat2006/unshelf
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            io.unshelf.channel=${{ env.CHANNEL }}

  web-image:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}

    steps:
      - name: Check out the approved source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to private GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish web trace image
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/rajat2006/unshelf-web:${{ env.TRACE }}
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ env.CHANNEL == 'production' && vars.VITE_CLERK_PUBLISHABLE_KEY_PRODUCTION || vars.VITE_CLERK_PUBLISHABLE_KEY_NONPRODUCTION }}
            VITE_YOUTUBE_OEMBED_ENABLED=true
          labels: |
            org.opencontainers.image.source=https://github.com/rajat2006/unshelf
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            io.unshelf.channel=${{ env.CHANNEL }}

  candidate:
    needs: [api-image, web-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out trusted control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: dev
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install trusted control-plane dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build trusted control plane
        run: pnpm --filter @unshelf/deployment-control-plane build

      - name: Log in to private GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and emit the immutable pair
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPROVED_CHANNEL: ${{ env.CHANNEL }}
          APPROVED_SOURCE_SHA: ${{ env.SOURCE_SHA }}
          APPROVED_EVENT: ${{ env.SOURCE_EVENT }}
          APPROVED_HEAD_BRANCH: ${{ env.HEAD_BRANCH }}
          APPROVED_HEAD_REPOSITORY: ${{ github.repository }}
          API_DIGEST: ${{ needs.api-image.outputs.digest }}
          WEB_DIGEST: ${{ needs.web-image.outputs.digest }}
        run: >-
          node packages/deployment-control-plane/dist/cli.js finalize-candidate
          --channel "$CHANNEL"
          --source-sha "$SOURCE_SHA"
          --api-digest "$API_DIGEST"
          --web-digest "$WEB_DIGEST"
